name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy --all-targets -- -D warnings
      - name: Rust tests
        run: cargo test
      - name: Network and socket tests
        run: cargo test -- --ignored --test-threads=1
      # - name: Service-pack tests
      #   run: cargo run --release -- --svc-dir services test

  release-binaries:
    # Publishing is intentionally limited to version tags. A tag such as v0.1.0
    # produces one installable archive for every supported platform.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            asset_name: linux-amd64
            use_cross: false
          - runner: ubuntu-24.04
            target: aarch64-unknown-linux-gnu
            asset_name: linux-arm64
            use_cross: true
          - runner: macos-14
            target: aarch64-apple-darwin
            asset_name: darwin-arm64
            use_cross: false
          - runner: macos-14
            target: x86_64-apple-darwin
            asset_name: darwin-amd64
            use_cross: false
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
            asset_name: windows-amd64
            use_cross: false
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install Cross
        if: matrix.use_cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross
      - name: Build
        if: ${{ !matrix.use_cross }}
        run: cargo build --locked --release --target ${{ matrix.target }}
      - name: Cross-build Linux ARM64
        if: matrix.use_cross
        run: cross build --locked --release --target ${{ matrix.target }}
      - name: Package Unix binary
        if: runner.os != 'Windows'
        shell: bash
        env:
          ASSET_NAME: ${{ matrix.asset_name }}
          VERSION: ${{ github.ref_name }}
          TARGET: ${{ matrix.target }}
        run: |
          mkdir dist
          tar -C "target/$TARGET/release" -czf "dist/munray-$VERSION-$ASSET_NAME.tar.gz" munray
      - name: Package Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          ASSET_NAME: ${{ matrix.asset_name }}
          VERSION: ${{ github.ref_name }}
          TARGET: ${{ matrix.target }}
        run: |
          New-Item -ItemType Directory -Path dist
          Compress-Archive -Path "target/$env:TARGET/release/munray.exe" -DestinationPath "dist/munray-$env:VERSION-$env:ASSET_NAME.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.asset_name }}
          path: dist/*
          if-no-files-found: error

  publish-release:
    needs: release-binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Generate checksums
        working-directory: dist
        run: sha256sum munray-* > SHA256SUMS.txt
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: dist/*
          fail_on_unmatched_files: true
