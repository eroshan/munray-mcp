[package]
# Canonical product/binary name. Cargo exposes it as CARGO_PKG_NAME at build time.
name = "munray"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "A persistent Lua runtime exposed over MCP"
license = "MIT"
readme = "README.md"
keywords = ["mcp", "lua", "automation"]
categories = ["command-line-utilities", "development-tools"]

[lib]
# Keep implementation imports independent of the product name.
name = "mcp_server"

[features]
default = ["mcp-client"]
mcp-client = [
    "dep:fs2",
    "dep:futures-util",
    "dep:sha2",
    "dep:sse-stream",
    "dep:subtle",
    "reqwest/form",
    "reqwest/stream",
    "rmcp/client",
    "rmcp/transport-streamable-http-client-reqwest",
    "tokio/net",
    "tokio/process",
    "tokio/time",
]

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive", "env"] }
mlua = { version = "0.10", features = ["lua54", "vendored", "serialize", "send"] }
parking_lot = "0.12"
libc = "0.2"
base64 = "0.22"
fs2 = { version = "0.4", optional = true }
futures-util = { version = "0.3", optional = true }
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls"] }
rmcp = { version = "1.7", features = ["transport-io", "elicitation", "schemars"] }
rusqlite = { version = "0.32", features = ["bundled"] }
schemars = "1.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
sha2 = { version = "0.10", optional = true }
sse-stream = { version = "0.2", optional = true }
subtle = { version = "2.6", optional = true }
tempfile = "3.15"
thiserror = "2.0"
uuid = { version = "1.12", features = ["v4", "serde"] }
walkdir = "2.5"
zip = { version = "2.4.2", default-features = false, features = ["deflate"] }
tokio = { version = "1.49", features = ["macros", "rt-multi-thread", "io-std"] }
interprocess = "2.4.3"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
