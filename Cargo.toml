[package]
name = "luaris-mcp"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "A persistent Lua runtime exposed over MCP"
license = "MIT"
readme = "README.md"
keywords = ["mcp", "lua", "automation"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive", "env"] }
mlua = { version = "0.10", features = ["lua54", "vendored", "serialize", "send"] }
parking_lot = "0.12"
base64 = "0.22"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls"] }
rmcp = { version = "1.7", features = ["transport-io", "elicitation", "schemars"] }
schemars = "1.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
tempfile = "3.15"
thiserror = "2.0"
uuid = { version = "1.12", features = ["v4", "serde"] }
walkdir = "2.5"
tokio = { version = "1.49", features = ["macros", "rt-multi-thread", "io-std"] }

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
